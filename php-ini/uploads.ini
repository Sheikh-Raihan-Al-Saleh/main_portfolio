; Upload limits for the local development server.
;
; `php artisan serve` adds this directory to PHP_INI_SCAN_DIR (see
; AppServiceProvider::raiseLocalServerUploadLimits), so these values apply no
; matter which PHP build starts the server. Herd ships with a 2M
; upload_max_filesize, which silently drops most screenshots and photos.
;
; The largest upload the app accepts is a 50 MB landing-page video, and one
; form can send several files at once (a project with a 12-image gallery), so
; the request limit is set well above the per-file limit.
;
; Production reads the same values from public/.user.ini and public/.htaccess.

upload_max_filesize = 64M
post_max_size = 128M
max_file_uploads = 30
