; Upload limits for PHP-FPM / CGI hosts (cPanel "MultiPHP" and most shared
; hosting). PHP reads this file from the directory of the front controller, so
; it must sit next to index.php -- copy it into public_html together with the
; rest of public/. Hosts may cache it for up to 5 minutes (user_ini.cache_ttl).
;
; Keep in sync with .htaccess (mod_php). Locally, set the same limits (or
; higher) in your own php.ini.

upload_max_filesize = 64M
post_max_size = 128M
max_file_uploads = 30
